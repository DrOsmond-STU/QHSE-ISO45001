name: Deploy

# DEPLOYMENT.md §4, §5 — build image (tag rilis) -> deploy staging otomatis ->
# smoke test -> APPROVAL GATE MANUAL -> deploy production (rolling/canary §5).
#
# BELUM BISA DIJALANKAN APA ADANYA — butuh konfigurasi yang belum tersedia di
# tahap ini (dicatat eksplisit, bukan disembunyikan sebagai "sudah selesai"):
#   1. Container registry (GHCR/ECR/dst.) + secret kredensialnya.
#   2. Cluster Kubernetes staging/production (kubeconfig sebagai secret).
#   3. GitHub Environment "production" dikonfigurasi manual di Settings >
#      Environments dengan "Required reviewers" — itulah mekanisme approval
#      gate manual (DEPLOYMENT.md §1 prinsip 4), bukan sesuatu yang bisa
#      di-set lewat file YAML ini sendiri.
# Job di bawah adalah kerangka yang benar secara struktur, tapi step registry
# push & kubectl apply masih placeholder sampai poin 1-3 di atas beres.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t qhse-api:${{ github.ref_name }} .

      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t qhse-web:${{ github.ref_name }} .

      # TODO: docker push ke registry begitu registry+secret tersedia (poin 1).

  deploy-staging:
    needs: build-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy ke staging (placeholder)
        run: echo "TODO — kubectl apply ke cluster staging begitu poin 2 tersedia"

      # DEPLOYMENT.md §11 — smoke test otomatis pasca-deploy staging.
